<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc6e8" />
    <title>みんなの島</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <header class="top">
        <div class="tower card">
          <div class="tower-label">🗼 みんなのタワー</div>
          <div class="tower-height"><span id="tower-m">0.0</span><small>m</small></div>
          <div class="next">
            <div class="bar"><div id="next-bar"></div></div>
            <div id="next-label" class="next-label"></div>
          </div>
        </div>
        <details class="ranking card" id="ranking-box" open>
          <summary>🏆 今日の貢献 TOP10</summary>
          <ol id="ranking"></ol>
        </details>
      </header>

      <div id="toasts"></div>

      <footer class="bottom">
        <div class="status card">
          <div class="inv">
            <span>🪵 <b id="inv-wood">0</b></span>
            <span>🪨 <b id="inv-stone">0</b></span>
            <span class="cap">/ <span id="inv-max"></span></span>
          </div>
          <div class="mine">あなたの累計 <b id="my-total">0.0</b>m</div>
          <a id="share" class="share" target="_blank" rel="noopener" href="https://x.com/intent/post">𝕏 でシェア</a>
        </div>
        <div class="stamps card" id="stamps"></div>
        <div class="hint" id="hint">木や岩をタップして採取 → タワーをタップして納品</div>
      </footer>
    </div>

    <div id="join" class="overlay">
      <form id="join-form" class="join card">
        <h1>🏝️ みんなの島</h1>
        <p>木や石を集めて、みんなでタワーを高くしよう！</p>
        <input id="name" name="name" maxlength="12" placeholder="なまえ（12文字まで）" autocomplete="nickname" required />
        <button type="submit">島へ行く</button>
      </form>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
